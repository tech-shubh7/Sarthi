<!doctype html><html><head><title>Apply</title>
<style>
  /* A sticky bar that fades in on scroll (hidden now) and a mobile-only copy: both come first in the page. */
  #bar { position: fixed; bottom: 0; left: 0; right: 0; opacity: 0; pointer-events: none; }
  .mobile-only { display: none; }
</style></head><body>
<div id="bar"><button type="submit" form="f" onclick="window.pressed='bar'">Submit</button></div>
<div class="mobile-only"><button type="submit" form="f" onclick="window.pressed='mobile'">Submit</button></div>
<form id="f" onsubmit="event.preventDefault(); location.href='thanks.html#' + window.pressed;">
  <div class="field"><label for="n">Full name *</label><input id="n" required></div>
  <button type="submit" onclick="window.pressed='form'">Submit</button>
</form>
</body></html>
